name: Publish VS Code Marketplace

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published release tag produced by the calling CI
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string
      publish_confirmed:
        description: I reviewed the publisher/listing and authorize publishing this release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kimono-marketplace
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_confirmed) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == github.ref_name)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require the Marketplace credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "Repository secret VSCE_PAT is required. No Marketplace publication was attempted." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release and download its VSIX packages
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          version="$(git show FETCH_HEAD:vscode/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')"
          server_version="$(git show FETCH_HEAD:package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')"
          publisher="$(git show FETCH_HEAD:vscode/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).publisher))')"
          extension_name="$(git show FETCH_HEAD:vscode/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).name))')"
          test "$version" = "$server_version"
          test "$RELEASE_TAG" = "v$version"
          test "$publisher" = "ai-kido"
          test "$extension_name" = "kimono-rag-mcp"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)"
          printf '%s\n' "$release" \
            | jq -e --arg tag "$RELEASE_TAG" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == false' >/dev/null
          mkdir -p "$RUNNER_TEMP/marketplace-assets"
          gh release download "$RELEASE_TAG" \
            --pattern "kimono-rag-mcp-$version-*.vsix" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/marketplace-assets"
          cd "$RUNNER_TEMP/marketplace-assets"
          mapfile -t checksums < <(
            grep -E "  kimono-rag-mcp-${version}-(darwin-arm64|darwin-x64|linux-arm64|linux-x64|win32-x64)\.vsix$" SHA256SUMS.txt
          )
          test "${#checksums[@]}" -eq 5
          printf '%s\n' "${checksums[@]}" | sha256sum -c -
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            test -f "kimono-rag-mcp-$version-$target.vsix"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace-assets/*.vsix
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace-assets

      - name: Publish every platform VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          EXTENSION_ID: ai-kido.kimono-rag-mcp
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            npx --no-install vsce publish --skip-duplicate \
              --packagePath "$RUNNER_TEMP/marketplace-assets/kimono-rag-mcp-$VERSION-$target.vsix"
          done

      - name: Verify Marketplace visibility
        env:
          EXTENSION_ID: ai-kido.kimono-rag-mcp
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if ! listing="$(npx --no-install vsce show "$EXTENSION_ID" --json)"; then
              echo "::warning::Marketplace lookup failed (attempt $attempt/60); retrying."
              sleep 20
              continue
            fi
            missing=()
            for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
              if jq -e --arg version "$VERSION" --arg target "$target" \
                'any(.versions[]?; .version == $version and .targetPlatform == $target)' \
                <<< "$listing" >/dev/null; then
                echo "Marketplace lists $EXTENSION_ID $VERSION for $target."
              else
                missing+=("$target")
              fi
            done
            if [[ "${#missing[@]}" -eq 0 ]]; then
              exit 0
            fi
            echo "Marketplace visibility pending (attempt $attempt/60): ${missing[*]}"
            sleep 20
          done
          echo "::error::All VSIX uploads were accepted, but visibility could not be confirmed within the retry window. Rerun this workflow with the same release_tag; accepted targets are skipped." >&2
          exit 1
