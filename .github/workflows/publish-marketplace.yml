name: Publish VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string
        default: v0.6.2
      publish_confirmed:
        description: I reviewed the publisher/listing and authorize publishing this release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.publish_confirmed
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require the Marketplace credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "Repository secret VSCE_PAT is required. No Marketplace publication was attempted." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release and download its VSIX packages
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          version="$(git show FETCH_HEAD:vscode/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')"
          server_version="$(git show FETCH_HEAD:package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')"
          publisher="$(git show FETCH_HEAD:vscode/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).publisher))')"
          extension_name="$(git show FETCH_HEAD:vscode/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).name))')"
          test "$version" = "$server_version"
          test "$RELEASE_TAG" = "v$version"
          test "$publisher" = "ai-kido"
          test "$extension_name" = "kimono-mcp"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)"
          printf '%s\n' "$release" \
            | jq -e --arg tag "$RELEASE_TAG" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == false' >/dev/null
          mkdir -p "$RUNNER_TEMP/marketplace-assets"
          gh release download "$RELEASE_TAG" \
            --pattern "kimono-mcp-$version-*.vsix" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/marketplace-assets"
          cd "$RUNNER_TEMP/marketplace-assets"
          mapfile -t checksums < <(
            grep -E "  kimono-mcp-${version}-(darwin-arm64|linux-arm64|linux-x64|win32-x64)\.vsix$" SHA256SUMS.txt
          )
          test "${#checksums[@]}" -eq 4
          printf '%s\n' "${checksums[@]}" | sha256sum -c -
          for target in darwin-arm64 linux-arm64 linux-x64 win32-x64; do
            test -f "kimono-mcp-$version-$target.vsix"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace-assets/*.vsix
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish_confirmed
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [darwin-arm64, linux-arm64, linux-x64, win32-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace-assets

      - name: Verify publisher access
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          publishers="$(npx --no-install vsce ls-publishers)"
          if ! grep -Fxq "ai-kido" <<<"$publishers"; then
            echo "VSCE_PAT does not authorize the ai-kido publisher. No publication was attempted." >&2
            exit 1
          fi

      - name: Publish platform VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          npx --no-install vsce publish --packagePath \
            "$RUNNER_TEMP/marketplace-assets/kimono-mcp-$VERSION-$TARGET.vsix"
