name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install fast-grep --version 0.5.0 --locked
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build