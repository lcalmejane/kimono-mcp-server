name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      reused: ${{ steps.previous.outputs.reused }}
      run-id: ${{ steps.previous.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require tag to match both package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const file of ["package.json", "vscode/package.json"]) {
              if (`v${JSON.parse(readFileSync(file)).version}` !== process.env.GITHUB_REF_NAME) {
                throw new Error(`Tag does not match ${file}`);
              }
            }
          '
      - name: Reuse validation of the identical main commit
        id: previous
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-validation.mjs

  extension-test:
    needs: validation
    if: needs.validation.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:vscode

  linux:
    needs: validation
    if: needs.validation.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/package
        with:
          target: linux-x64

  test:
    needs: [validation, linux]
    if: needs.validation.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kimono-native-linux-x64
          path: native-bundles/linux-x64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test-prebuilt
          build-args: BUNDLE_TARGET=linux-x64
          load: true
          tags: kimono-test
          cache-from: type=gha,scope=kimono-linux-x64
          cache-to: type=gha,scope=kimono-linux-x64,mode=max
      - run: docker run --rm kimono-test sh -c 'node scripts/check-search-versions.mjs --offline && npm run typecheck && npm test'

  bundle:
    if: >-
      always() && needs.validation.result == 'success' &&
      (needs.validation.outputs.reused == 'true' ||
        (needs.test.result == 'success' && needs.extension-test.result == 'success' && needs.linux.result == 'success')) &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [validation, linux, test, extension-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}

  linux-arm:
    if: >-
      always() && needs.validation.result == 'success' &&
      (needs.validation.outputs.reused == 'true' ||
        (needs.test.result == 'success' && needs.extension-test.result == 'success' && needs.linux.result == 'success')) &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [validation, linux, test, extension-test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/package
        with:
          target: linux-arm64

  container:
    if: >-
      always() && needs.validation.result == 'success' && needs.linux-arm.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validation, linux-arm]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      release_tag: ${{ github.ref_name }}
      linux_run_id: ${{ needs.validation.outputs.run-id }}

  release:
    if: >-
      always() && needs.validation.result == 'success' && needs.bundle.result == 'success' &&
      needs.linux-arm.result == 'success' && needs.container.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validation, bundle, linux-arm, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kimono-native-*
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kimono-vscode-*
          path: vscode-assets
          merge-multiple: true
      - name: Download previously validated Linux native bundle
        if: needs.validation.outputs.reused == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kimono-native-linux-x64
          path: release-assets/kimono-native-linux-x64
          run-id: ${{ needs.validation.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Download previously validated Linux VSIX
        if: needs.validation.outputs.reused == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kimono-vscode-linux-x64
          path: vscode-assets
          run-id: ${{ needs.validation.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Archive target bundles and publish checksums
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if [[ "$target" != win32-* ]]; then
              chmod +x "release-assets/kimono-native-${target}/bin/"*
            fi
            tar -czf "kimono-native-${target}.tar.gz" -C "release-assets/kimono-native-${target}" .
          done
          cp vscode-assets/* .
          sha256sum kimono-native-*.tar.gz kimono-rag-mcp-*.vsix kimono-rag-mcp-*.build.json > SHA256SUMS.txt
      - name: Publish VSIX and native bundles to the version release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Immutable releases reject uploads after publication: attach assets to a draft, then publish.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Release $GITHUB_REF_NAME is already published and immutable." >&2; exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "Standalone Kimono MCP VS Code extensions and native bundles. Installation: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/vscode/README.md"
          gh release upload "$GITHUB_REF_NAME" kimono-native-*.tar.gz kimono-rag-mcp-*.vsix kimono-rag-mcp-*.build.json SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  marketplace:
    if: >-
      always() && needs.release.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/publish-marketplace.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}