name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t kimono-test .
      - run: docker run --rm kimono-test sh -c 'node scripts/check-search-versions.mjs --offline && npm run typecheck && npm test && npm run build'

  bundle:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Validate locked dependency pins
        run: node scripts/check-search-versions.mjs --offline
      - name: Require tag version to match package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Package target assets
        shell: bash
        run: |
          npm run bundle:native -- \
            --target "${{ matrix.target }}" \
            --output "native-bundles/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kimono-native-${{ matrix.target }}
          path: native-bundles/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kimono-native-*
          path: release-assets
      - name: Archive target bundles and publish checksums
        run: |
          for target in darwin-arm64 linux-arm64 linux-x64 win32-x64; do
            tar -czf "kimono-native-${target}.tar.gz" -C "release-assets/kimono-native-${target}" .
          done
          sha256sum kimono-native-*.tar.gz > SHA256SUMS.txt
      - name: Publish native bundles to the version release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Immutable releases reject uploads after publication: attach assets to a draft, then publish.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Release $GITHUB_REF_NAME is already published and immutable." >&2; exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "Reproducible native Kimono bundles for this tagged release."
          gh release upload "$GITHUB_REF_NAME" kimono-native-*.tar.gz SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false