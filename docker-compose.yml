services:
  kimono-mcp-server:
    build: .
    image: ${KIMONO_IMAGE:-kimono-mcp-server:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    init: true
    stop_grace_period: 40s
    environment:
      AIKIDO_ROOT: /knowledge/${AIKIDO_DIR:-aikido}
      KIMONO_CORPUS_MODE: ${KIMONO_CORPUS_MODE:-rag}
      KIMONO_LOG_LEVEL: ${KIMONO_LOG_LEVEL:-error}
      KIMONO_SEMANTIC_DEVICE: ${KIMONO_SEMANTIC_DEVICE:-auto}
      KIMONO_CODE_PROFILE_ENABLED: ${KIMONO_CODE_PROFILE_ENABLED:-false}
      KIMONO_CODE_MODEL_DIR: ${KIMONO_CODE_MODEL_DIR:-}
      KIMONO_SEMANTIC_PERSISTENT_WORKER: ${KIMONO_SEMANTIC_PERSISTENT_WORKER:-true}
      KIMONO_SEMANTIC_WORKERS: ${KIMONO_SEMANTIC_WORKERS:-auto}
      KIMONO_SEMANTIC_THREADS: ${KIMONO_SEMANTIC_THREADS:-auto}
      KIMONO_SEMANTIC_BATCH: ${KIMONO_SEMANTIC_BATCH:-auto}
      KIMONO_SEMANTIC_CPU_PERCENT: ${KIMONO_SEMANTIC_CPU_PERCENT:-80}
      KIMONO_SEMANTIC_MEMORY_PERCENT: ${KIMONO_SEMANTIC_MEMORY_PERCENT:-80}
      AIKIDO_WRITABLE: ${AIKIDO_WRITABLE:-false}
      AIKIDO_INCLUDE_SPEC: ${AIKIDO_INCLUDE_SPEC:-false}
      AIKIDO_REPOSITORY: ${AIKIDO_REPOSITORY:-https://github.com/lcalmejane/aikido.git}
      AIKIDO_REF: ${AIKIDO_REF:-main}
      KIMONO_GIT_PROFILE_FILE: ${KIMONO_GIT_PROFILE_FILE:-}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
    ports:
      - "127.0.0.1:${MCP_PORT:-3000}:3000"
    volumes:
      - ${AIKIDO_HOST_PARENT:-./data}:/knowledge:${AIKIDO_VOLUME_MODE:-ro}
      - ${KIMONO_CODE_MODEL_HOST_DIR:-./models/code}:/opt/kimono/code-model:ro
      - kimono-cache:/home/node/.cache/kimono
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  install-aikido:
    build: .
    profiles: ["install"]
    entrypoint: ["node", "dist/cli.js"]
    command: ["init", "--root", "/knowledge/${AIKIDO_DIR:-aikido}", "--ref", "${AIKIDO_REF:-main}", "--repository", "${AIKIDO_REPOSITORY:-https://github.com/lcalmejane/aikido.git}"]
    environment:
      AIKIDO_ROOT: /knowledge/${AIKIDO_DIR:-aikido}
      KIMONO_GIT_PROFILE_FILE: ${KIMONO_GIT_PROFILE_FILE:-}
    volumes:
      - ${AIKIDO_HOST_PARENT:-./data}:/knowledge:rw

volumes:
  kimono-cache: