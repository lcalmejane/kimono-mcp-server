[package]
name = "kimono-semantic"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
embsearch-core = { version = "=0.3.4", features = ["onnx"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
